name: CI (analyze, test, scan vulnerabilities)

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  merge_group:

jobs:
  build_test_scan:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: dotnet restore
      run: dotnet restore src/Swiss.FCh.DocumentService.Client.slnx

    - name: dotnet format style
      run: dotnet format style src/Swiss.FCh.DocumentService.Client.slnx --verify-no-changes --no-restore

    - name: dotnet format whitespace
      run: dotnet format whitespace src/Swiss.FCh.DocumentService.Client.slnx --verify-no-changes --no-restore

    - name: dotnet build
      run: dotnet build src/Swiss.FCh.DocumentService.Client.slnx --configuration Release --no-restore

    - name: dotnet test
      run: dotnet test src/Swiss.FCh.DocumentService.Client.slnx --configuration Release --no-build --verbosity normal

    - name: dotnet pack
      run: dotnet pack src/Swiss.FCh.DocumentService.Client/Swiss.FCh.DocumentService.Client.csproj --configuration Release --no-build -o ./nupkgs

    - name: Scan NuGet packages for known vulnerabilities
      run: dotnet list src/Swiss.FCh.DocumentService.Client.slnx package --vulnerable --include-transitive
